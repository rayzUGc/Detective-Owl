<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detective Owl</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF6DC;--card:#FFFFFF;--ink:#23305A;--muted:#5D6890;--blue:#2F8CFF;--green:#1E9E58;--red:#E8402F;--sun:#FFC933;--line:#FFE3A1;--bubble:#E8F2FF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171C3A;--card:#232A52;--ink:#F5F1E3;--muted:#B4BBE0;--line:#3A4378;--bubble:#2C3566;--green:#4BD58A;--red:#FF7060;--blue:#6FB0FF}}
:root[data-theme="dark"]{--bg:#171C3A;--card:#232A52;--ink:#F5F1E3;--muted:#B4BBE0;--line:#3A4378;--bubble:#2C3566;--green:#4BD58A;--red:#FF7060;--blue:#6FB0FF}
:root[data-skin="ocean"]{--bg:#DFF3FF;--card:#fff;--line:#A8DBF5;--bubble:#E1F4FF;--blue:#0E7FD1;--sun:#7FE0D4;--ink:#0C3556;--muted:#3E6784;--green:#16895A;--red:#D93A2B}
:root[data-skin="space"]{--bg:#0E1030;--card:#1B1F4A;--line:#3B3F8C;--bubble:#272C66;--ink:#F1EEFF;--muted:#B5B8E8;--blue:#8E7BFF;--sun:#FFD666;--green:#5BE3A0;--red:#FF7B8A}
:root[data-skin="candy"]{--bg:#FFE6F2;--card:#fff;--line:#FFB8DA;--bubble:#FFEAF5;--blue:#D63D91;--sun:#FFE066;--ink:#5A1C44;--muted:#8C4A72;--green:#168A58;--red:#D93A2B}
:root[data-skin="sunset"]{--bg:#FFE9D6;--card:#fff;--line:#FFC59A;--bubble:#FFF0E4;--blue:#E8590C;--sun:#FFD166;--ink:#4A1F0F;--muted:#85513A;--green:#1B8A4A;--red:#C92A2A}
:root[data-skin="jungle"]{--bg:#E3F5D8;--card:#fff;--line:#A9D98F;--bubble:#EAF8DF;--blue:#2E8B3D;--sun:#FFD84D;--ink:#1F3D1C;--muted:#4A6B45;--green:#0E7A3A;--red:#D93A2B}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Baloo 2','Trebuchet MS','Comic Sans MS',system-ui,sans-serif;font-weight:500}
body{min-height:100%;padding:16px}
.app{max-width:700px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;margin-bottom:14px}
h1{font-size:1.35rem;margin:0;font-weight:800;flex:1}
h2{font-size:1.7rem;margin:6px 0;font-weight:800;line-height:1.15}
h3{margin:14px 0 6px;font-size:1.2rem}
.stars{background:var(--sun);color:#3a2a00;border-radius:999px;padding:2px 14px;font-weight:800;font-size:1.15rem;white-space:nowrap}
.mute{font:inherit;font-size:1.3rem;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:14px;padding:0 9px;cursor:pointer}
.mute.off{opacity:.4}
.card{background:var(--card);border-radius:24px;padding:22px;border:3px solid var(--line)}
.card.out{animation:outp .26s ease-in forwards}
.card.in{animation:inp .4s cubic-bezier(.2,1.3,.4,1)}
@keyframes outp{to{transform:translateX(-70px) scale(.94);opacity:0}}
@keyframes inp{from{transform:translateX(80px) scale(.94);opacity:0}}
.badge{display:inline-block;background:var(--blue);color:#fff;border-radius:99px;padding:0 14px;font-weight:700}
.ask{font-size:1.1rem;color:var(--muted);margin:0 0 12px}
.sent{font-size:1.6rem;line-height:1.5;margin:12px 0;font-weight:700}
.say{display:flex;gap:10px;align-items:flex-start;margin:8px 0 14px}
.say .owl{font-size:2.2rem;line-height:1}
.say p{margin:0;background:var(--bubble);border-radius:18px;padding:10px 16px;font-size:1.1rem;flex:1;min-height:50px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:800;font-size:1.25rem;border:0;border-radius:18px;padding:9px 22px;cursor:pointer;background:var(--blue);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2);touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn.go{background:var(--green)}
.btn.no{background:var(--red)}
.btn.opt{background:var(--card);color:var(--ink);border:3px solid var(--blue);box-shadow:0 5px 0 var(--line)}
.btn.opt.ok{background:var(--green);color:#fff;border-color:var(--green)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,input:focus-visible{outline:4px solid var(--blue);outline-offset:2px}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
input{font:inherit;font-size:1.2rem;width:100%;padding:8px 14px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink);margin:4px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:10px 0}
.pc{background:var(--bubble);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:4px}
.pc b{font-size:1.25rem}.pc small{color:var(--muted)}
.pc .em{font-size:2rem}
.mini{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.mini i{display:block;height:100%;background:var(--green)}
.dots{display:flex;gap:5px;margin:8px 0}.dots i{flex:1;height:9px;border-radius:9px;background:var(--line)}.dots i.d{background:var(--green)}.dots i.c{background:var(--blue)}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:2px dashed var(--line)}
.it .btn{font-size:1rem;padding:5px 14px}
.code{font-size:1.3rem;font-weight:800;word-break:break-all;background:var(--bubble);border-radius:14px;padding:10px 14px;margin:8px 0;user-select:all}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;overflow:auto}
.modal .card{max-width:440px;width:100%}
.hide{display:none}
#splash{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;transition:opacity .4s}
#splash.gone{opacity:0;pointer-events:none}
#splash .big{font-size:5rem;line-height:1;animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-16px) rotate(6deg)}}
.lbarw{width:min(320px,80vw);height:22px;background:var(--line);border-radius:99px;overflow:hidden}
.lbarw i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22C06A,#7AE582);transition:width .25s}
.toast{position:fixed;left:50%;top:14%;background:#1E9E58;color:#fff;font-weight:800;font-size:1.4rem;padding:8px 26px;border-radius:99px;pointer-events:none;z-index:30;animation:toastp 1.6s forwards}
@keyframes toastp{0%{transform:translate(-50%,20px) scale(.5);opacity:0}15%{transform:translate(-50%,0) scale(1.1);opacity:1}80%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-30px);opacity:0}}
.star{position:absolute;font-size:2.2rem;background:none;border:0;cursor:pointer;padding:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header><h1 id="ttl">🦉 Detective Owl</h1><div class="stars" id="stars">⭐ 0</div><button class="mute" id="mus" aria-label="Turn music off">🎵</button><button class="mute" id="mute" aria-label="Turn sound off">🔊</button><button class="mute" id="shp" aria-label="Shop">🛍️</button><button class="mute" id="menu" aria-label="Menu">☰</button></header>
  <main class="card" id="stage"></main>
</div>
<div class="modal hide" id="modal"></div>
<div id="splash"><div class="big">🦉</div><h1 style="flex:none;font-size:2rem">Detective Owl</h1><div class="lbarw"><i id="lbar"></i></div><p class="ask" id="ltip" role="status" style="min-height:1.5em;margin:0">Loading…</p><button class="btn go hide" id="lgo">Tap to start</button></div>
<script>
const $=id=>document.getElementById(id);
const pick=a=>a[Math.random()*a.length|0];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const cap=s=>s[0].toUpperCase()+s.slice(1);
const dis=(c,pool,n=2)=>shuf(pool.filter(x=>x!==c)).slice(0,n);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const Q=(t,a,d,w)=>({t,a,o:shuf([a,...d]),w});

/* ---------- question banks (made fresh every round) ---------- */
const N=["mango","teacher","river","dog","school","market","sister","garden","doctor","basket"],AB=["joy","freedom","friendship","honesty","courage","kindness"],V=["jump","sing","carry","laugh","swim","dance"],AJ=["tall","shiny","brave","quiet","sweet","funny"],N2=["dog","tree","bag","house","bird","box"];
const PL=[["cat","cats"],["box","boxes"],["baby","babies"],["child","children"],["leaf","leaves"],["man","men"],["tooth","teeth"],["bus","buses"],["foot","feet"],["dish","dishes"]];
const SV=[["I","am"],["He","is"],["She","is"],["We","are"],["They","are"],["The girls","are"],["The boy","is"],["You","are"]];
const VP=[["walk","walked"],["play","played"],["go","went"],["eat","ate"],["see","saw"],["run","ran"],["swim","swam"],["sing","sang"],["jump","jumped"],["give","gave"]];
const TS=["Yesterday","Last night","Last week","Long ago"],SU=["I","we","they","she","he"];
const V3=[["run","runs"],["jump","jumps"],["eat","eats"],["sleep","sleeps"],["sing","sings"]];
const CP=[["tall","taller","tallest"],["big","bigger","biggest"],["small","smaller","smallest"],["fast","faster","fastest"],["happy","happier","happiest"],["long","longer","longest"]];
const PR=[["Maria","she"],["Tom","he"],["The dog","it"],["Maria and Tom","they"],["My sister","she"],["My father","he"]],OBJ={she:"her",he:"him",it:"it",they:"them"},POS_={she:"her",he:"his",it:"its",they:"their"};
const TM=[["I was born ___ July.","in"],["School starts ___ Monday.","on"],["We eat dinner ___ 6 o’clock.","at"],["It rains ___ the afternoon.","in"],["The party is ___ Friday.","on"],["The bus leaves ___ noon.","at"]];
const PP=[["The fish swims ___ the water.","in"],["The book is ___ the table.","on"],["We wait ___ the bus stop.","at"],["The keys are ___ my bag.","in"],["The picture is ___ the wall.","on"],["She stands ___ the door.","at"]];
const DR=[["She walked ___ the bridge.","across"],["He jumped ___ the pool.","into"],["The ball rolled ___ the hill.","down"],["The cat climbed ___ the tree.","up"],["We drove ___ the tunnel.","through"],["The bird flew ___ the house.","over"]];
const G=[
 [()=>{const n=pick(N),v=pick(V),a=pick(AJ);return Q("Which word is a noun?",n,[v,a],`${cap(n)} is a noun. ${cap(v)} is an action word and ${a} describes things.`)},
  ()=>{const[s,p]=pick(PL);return Q(`One ${s}, many ___.`,p,dis(p,[s+"s",s+"es",s+"ies",s+"ren"]),`The plural of ${s} is ${p}.`)},
  ()=>{const n=pick(AB),v=pick(V),a=pick(AJ);return Q("Which noun names an idea or a feeling?",n,[v,a],`${cap(n)} is an idea you can’t touch, but it is still a noun.`)}],
 [()=>{const[s,v]=pick(SV);return Q(`${s} ___ happy today.`,v,dis(v,["am","is","are"]),`${s} goes with ${v}.`)},
  ()=>{const[b,p]=pick(VP),s=pick(SU),t=pick(TS);return Q(`${t}, ${s} ___ (${b}).`,p,[b,"will "+b],`${t} means it already happened, so we say ${p}.`)},
  ()=>{const[b,z]=pick(V3),sg=Math.random()<.5,s=sg?pick(["The dog","My sister","The bird"]):pick(["The dogs","My sisters","The birds"]),a=sg?z:b;return Q(`${s} ___ every day.`,a,dis(a,[b,z,b+"ing"]),sg?`One person or animal: add s, so ${z}.`:`More than one: no s, so ${b}.`)}],
 [()=>{const a=pick(AJ),n=pick(N2);return Q(`Which word describes the noun in “The ${a} ${n}”?`,a,["The",n],`${cap(a)} tells us what the ${n} is like.`)},
  ()=>{const[b,c,s]=pick(CP);return Q(`This ${pick(N2)} is ___ than that one.`,c,dis(c,[b,s,"more "+b]),`Comparing two things: add er, so ${c}.`)},
  ()=>{const[b,c,s]=pick(CP);return Q(`That is the ___ ${pick(N2)} in the world!`,s,dis(s,[b,c,"most "+b]),`The most of all: add est, so ${s}.`)}],
 [()=>{const[n,p]=pick(PR);return Q(`${n} is kind. ___ helps everyone.`,cap(p),dis(p,["he","she","it","they","we"]).map(cap),`We use “${p}” to talk about ${n}.`)},
  ()=>{const[n,p]=pick(PR),o=OBJ[p];return Q(`We saw ${n} at the shop. We waved at ___.`,o,dis(o,[p,"us","hers","me"]),`After a word like “at” we use ${o}.`)},
  ()=>{const[n,p]=pick(PR),o=POS_[p];return Q(`The bag belongs to ${n}. It is ___ bag.`,o,dis(o,["he","she","hers","them","him"]),`Belonging to ${n}: ${o}.`)}],
 [()=>{const[t,a]=pick(TM);return Q(t,a,dis(a,["in","on","at"]),`Times and dates: in (months), on (days), at (clock times).`)},
  ()=>{const[t,a]=pick(PP);return Q(t,a,dis(a,["in","on","at"]),`The word “${a}” fits this place best.`)},
  ()=>{const[t,a]=pick(DR);return Q(t,a,dis(a,["with","of","about","for"]),`“${cap(a)}” shows the way something moves.`)}]
];
const POS=[{k:"Nouns",e:"🍎"},{k:"Verbs",e:"🏃"},{k:"Adjectives",e:"🌈"},{k:"Pronouns",e:"👤"},{k:"Prepositions",e:"📍"}];
const LT=["Rookie","Sleuth","Sharp Eye","Inspector","Detective","Chief","Ace","Master","Legend","Grand Owl"];

/* ---------- shop items ---------- */
const SK=[{n:"Sunny",c:0,id:"sunny"},{n:"Ocean",c:30,id:"ocean"},{n:"Space",c:60,id:"space"},{n:"Candy",c:90,id:"candy"}];
const MUS=[{n:"Bouncy",c:0,d:.2143,p:"C,Am,F,G",ty:"square",k:1},{n:"Chill",c:40,d:.3,p:"Am,F,C,G",ty:"sine",k:0},{n:"Rock",c:70,d:.17,p:"C,G,Am,F",ty:"sawtooth",k:1}];
const HAT=[{n:"No hat",e:"",c:0},{n:"Top hat",e:"🎩",c:20},{n:"Detective",e:"🕵️",c:25},{n:"Grad cap",e:"🎓",c:35},{n:"Crown",e:"👑",c:50}];
const ITEMS=[...SK.map((x,i)=>({g:"sk",i,b:i,n:x.n+" theme",c:x.c})),...MUS.map((x,i)=>({g:"mu",i,b:4+i,n:x.n+" music",c:x.c})),...HAT.map((x,i)=>({g:"ht",i,b:7+i,n:x.n+" "+x.e,c:x.c})),{g:"gm",i:0,b:12,n:"Game: Star Pop 🌟",c:100}];

/* ---------- state, save codes ---------- */
const fresh=name=>({name,r:[0,0,0,0,0],stars:0,mask:145,sk:0,mu:0,ht:0,mk:"",mx:0});
let S=null,scr="name",P=0,qs=[],qi=0,good=0,missed=false,locked=false,gameT=null;
const own=b=>(S.mask>>b)&1;
const lv=p=>Math.floor(S.r[p]/2)+1;
const save=()=>{try{localStorage.setItem("owl",JSON.stringify(S));}catch(e){}};
const chk=(name,p)=>{let h=7;for(const c of name.trim().toLowerCase()+"|"+p)h=(h*31+c.charCodeAt(0))%46656;return h.toString(36).toUpperCase().padStart(3,"0");};
const mkCode=()=>{const p=[...S.r,S.stars,S.mask,S.sk*100+S.mu*10+S.ht].map(n=>n.toString(36)).join("-").toUpperCase();return p+"-"+chk(S.name,p);};
function readCode(name,code){const a=code.trim().toUpperCase().split("-");if(a.length!==9)return null;const c=a.pop(),p=a.join("-");if(chk(name,p)!==c)return null;const n=a.map(x=>parseInt(x,36));if(n.some(isNaN))return null;const e=n[7];return{name:name.trim(),r:n.slice(0,5),stars:n[5],mask:n[6],sk:Math.floor(e/100),mu:Math.floor(e/10)%10,ht:e%10};}

/* ---------- sound + music ---------- */
let AC=null,muted=false,musicOn=true,mt=null,mg=null,hold=false,ms=0,nextT=0;
function tone(f,t,d,ty,v,f2){const o=AC.createOscillator(),g=AC.createGain();o.type=ty||"sine";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}
function sfx(k){if(muted)return;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();startMusic();const n=AC.currentTime;
 if(k==="tap")tone(660,n,.06,"triangle",.12);
 else if(k==="good")[523,659,784].forEach((f,j)=>tone(f,n+j*.09,.18,"sine",.18));
 else if(k==="bad")tone(240,n,.25,"sawtooth",.08,140);
 else if(k==="whoosh")tone(300,n,.22,"sine",.1,1000);
 else if(k==="win")[523,523,659,784,659,784,1047].forEach((f,j)=>tone(f,n+j*.13,.3,"triangle",.2));
}catch(e){}}
const CH={C:[131,[523,659,784,659]],Am:[110,[440,523,659,523]],F:[87,[349,440,523,440]],G:[98,[392,494,587,494]]};
function mn(f,t,d,ty,v,f2){if(!mg)return;const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.02);}
function mnote(i,t){const m=MUS[S?S.mu:0],c=CH[m.p.split(",")[i>>3]],k=i%8;mn(k%4===2?c[0]*2:c[0],t,.2,"triangle",.22);mn(c[1][k%4],t,.16,m.ty,m.ty==="sine"?.06:.035);if(m.k){if(k%2===0)mn(120,t,.12,"sine",.3,45);else mn(7000,t,.03,"square",.012);}}
function sched(){if(!AC||!mg)return;const d=MUS[S?S.mu:0].d;if(nextT<AC.currentTime-.3)nextT=AC.currentTime;while(nextT<AC.currentTime+.3){mnote(ms,nextT);nextT+=d;ms=(ms+1)%32;}}
function startMusic(){if(muted||!musicOn||hold||mt||!AC)return;mg=AC.createGain();mg.gain.value=.5;mg.connect(AC.destination);ms=0;nextT=AC.currentTime+.05;mt=setInterval(sched,100);}
function stopMusic(){if(mt){clearInterval(mt);mt=null;}if(mg){try{mg.gain.setTargetAtTime(0,AC.currentTime,.05);}catch(e){}mg=null;}}
$("mute").onclick=function(){muted=!muted;this.textContent=muted?"🔇":"🔊";this.setAttribute("aria-label",muted?"Turn sound on":"Turn sound off");if(muted)stopMusic();else sfx("tap");};
$("mus").onclick=function(){musicOn=!musicOn;this.classList.toggle("off",!musicOn);this.setAttribute("aria-label",musicOn?"Turn music off":"Turn music on");if(musicOn)sfx("tap");else stopMusic();};
document.addEventListener("visibilitychange",()=>{if(document.hidden)stopMusic();else startMusic();});

/* ---------- ui helpers ---------- */
const stage=$("stage");
function refresh(){$("stars").textContent="⭐ "+(S?S.stars:0);$("ttl").textContent=(S?HAT[S.ht].e:"")+"🦉 Detective Owl";document.documentElement.dataset.skin=S?SK[S.sk].id:"sunny";}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1700);}
function go(fn){stage.className="card out";sfx("whoosh");setTimeout(()=>{fn();refresh();stage.className="card in";},260);}
function shake(el){sfx("bad");el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");}
function say(t){$("msg").textContent=t;}
function modal(html){const m=$("modal");m.innerHTML='<div class="card" role="dialog" aria-modal="true">'+html+'</div>';m.classList.remove("hide");const b=m.querySelector("button");if(b)b.focus();}
function closeModal(){$("modal").classList.add("hide");}
function on(id,fn){$(id).onclick=()=>{sfx("tap");fn();};}
function copy(t){try{navigator.clipboard.writeText(t);toast("Copied!");}catch(e){toast("Select and copy it");}}

/* ---------- screens ---------- */
function nameScreen(){
  scr="name";let saved=null;try{saved=JSON.parse(localStorage.getItem("owl"));}catch(e){}
  stage.innerHTML=`<h2>🦉 Detective Owl</h2><p class="ask">Solve grammar cases, win stars and unlock cool stuff!</p>
  <label for="nm"><b>Your name</b></label><input id="nm" maxlength="16" autocomplete="off" placeholder="Type your name">
  <div class="row"><button class="btn go" id="start">New game</button>${saved&&saved.name?`<button class="btn" id="cont">Continue as ${esc(saved.name)}</button>`:""}</div>
  <h3>Have a code?</h3><input id="cd" autocomplete="off" placeholder="Paste your code (your name must match)"><button class="btn opt" id="load">Load my game</button>
  <div class="say"><span class="owl">🦉</span><p id="msg">Hi! What’s your name, detective?</p></div><div class="row"><button class="btn opt" id="tch" style="font-size:1rem;padding:4px 14px">👩‍🏫 Teacher</button></div>`;
  on("start",()=>{const n=$("nm").value.trim();if(!n){say("Please type your name first!");return;}S=fresh(n);save();go(home);});

function streak(){const st=jget("owlday:"+S.name.toLowerCase()+"s",null);return st&&st.n>=2&&(st.d===day()||st.d===new Date(Date.now()-864e5).toDateString())?` 🔥 ${st.n}-day streak!`:"";}
function logMiss(q){const m=jget("owlmiss",[]).filter(x=>x.t!==q.t);m.unshift({t:q.t,a:q.a,o:q.o,w:q.w});jset("owlmiss",m.slice(0,20));}
function clearMiss(q){jset("owlmiss",jget("owlmiss",[]).filter(x=>x.t!==q.t));}
function speak(q){try{const u=new SpeechSynthesisUtterance(q.t.replace(/___/g,"blank")+". "+q.o.join(". "));u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){toast("Reading aloud isn’t available");}}
stage.addEventListener("click",e=>{if(e.target.closest("#rd")&&curQ)speak(curQ);});
function dailyStart(){MODE=1;scr="round";qs=[];for(let i=0;i<5;i++){const p=Math.random()*5|0;qs.push(pick(G[p].slice(0,2).concat(C[p],C2[p]))());}qi=0;good=0;showQ();}
function dailyDone(){scr="result";const earn=good*2+(good===5?5:0);S.stars+=earn;jset("owlchal:"+S.name.toLowerCase(),day());save();hold=true;stopMusic();sfx("win");if(good===5)confetti();
  stage.innerHTML=`<h2>Daily challenge done! 🎯</h2><p class="ask">${good} of 5 right the first time. You earned ⭐ ${earn}${good===5?" (includes a +5 perfect bonus)":""}. Come back tomorrow for a new one!</p><div class="row"><button class="btn go" id="hm">Home</button></div>`;refresh();on("hm",()=>{hold=false;go(home);});}
function notebookStart(){const m=jget("owlmiss",[]);if(!m.length){home();return;}MODE=2;scr="round";qs=shuf(m).slice(0,10).map(q=>({...q,o:shuf(q.o)}));qi=0;good=0;showQ();}
function notebookDone(){scr="result";S.stars+=good;save();stage.innerHTML=`<h2>Notebook practice done! 📓</h2><p class="ask">You fixed ${good} of ${qs.length} mistakes and earned ⭐ ${good}. Any you missed again stay in your notebook.</p><div class="row"><button class="btn go" id="hm">Home</button></div>`;refresh();on("hm",()=>go(home));}
/* ---------- challenges, settings, practice sheet ---------- */
const dfv=()=>S&&S.df!==undefined?S.df:1;
function speakText(t){try{const u=new SpeechSynthesisUtterance(t);u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function mixed(n){const l=[];for(let i=0;i<n;i++){const p=Math.random()*5|0;l.push(pick(G[p].slice(0,2).concat(C[p],C2[p]))());}return l;}
function weeklyStart(){MODE=3;scr="round";qs=mixed(10);qi=0;good=0;showQ();}
function weeklyDone(){scr="result";const earn=good*3+(good>=9?10:0);S.stars+=earn;jset("owlweek:"+S.name.toLowerCase(),wkk());save();hold=true;stopMusic();sfx("win");if(good>=9)confetti();
  stage.innerHTML=`<h2>Weekly challenge done! 🏅</h2><p class="ask">${good} of 10 right the first time. You earned ⭐ ${earn}${good>=9?" (includes a +10 bonus for 9 or more)":""}. A new challenge starts on Monday!</p><div class="row"><button class="btn go" id="hm">Home</button></div>`;refresh();on("hm",()=>{hold=false;go(home);});}
async function sheet(){
  const list=shuf(jget("owlmiss",[])).slice(0,10).map(q=>({...q}));while(list.length<10)list.push(mixed(1)[0]);
  let t=`DETECTIVE OWL PRACTICE SHEET\nName: ${S.name}     Date: ${new Date().toLocaleDateString()}\n\nCircle the best answer.\n\n`;
  list.forEach((q,i)=>{t+=`${i+1}) ${q.t}\n    `+q.o.map((o,j)=>`${"abc"[j]}. ${o}`).join("     ")+"\n\n";});
  t+="\n--- ANSWER KEY ---\n"+list.map((q,i)=>`${i+1}) ${"abc"[q.o.indexOf(q.a)]}. ${q.a}  (${q.w})`).join("\n")+"\n";
  try{const dl=typeof claude==="undefined"?null:await claude.use("downloads");if(!dl){toast("Saving isn’t available here");return;}await dl.save({filename:"Practice-sheet-"+S.name.replace(/[^\w-]+/g,"_")+".txt",data:new Blob([t],{type:"text/plain"})});}catch(e){if(!e||e.code!=="declined")toast("Couldn’t save it");}
}
/* ---------- assignments + round length ---------- */
let ASG=null;
const rlv=()=>S&&S.rl?S.rl:10;
async function loadAssign(){let a=null;if(DB&&UID){try{const d=await DB.doc("assign/current").get();if(d.exists)a=d.data();}catch(e){}}if(!a)a=jget("owlassign",null);ASG=a&&a.p>=0&&a.p<5?a:null;}
async function showAsg(){await loadAssign();if(scr!=="home"||!$("asg")||!ASG)return;$("asg").innerHTML=`<div class="pc" style="margin:8px 0"><b>📌 Assignment from your teacher</b><span>Practice <b>${POS[ASG.p].k}</b>. Rounds in this topic earn +2 bonus ⭐!</span><button class="btn go" id="ap">Play ${POS[ASG.p].k}</button></div>`;on("ap",()=>{P=ASG.p;go(startRound);});}
/* ---------- menu, save, exit ---------- */
function showCode(){if(!S)return;save();const c=mkCode();modal(`<h2>💾 Progress saved</h2><p class="ask">Your code for <b>${esc(S.name)}</b>. Keep it safe! You need your name and this code to come back from any device.</p><div class="code">${c}</div><div class="row"><button class="btn go" id="m1">Copy code</button><button class="btn opt" id="m2">Close</button></div>`);on("m1",()=>copy(c));on("m2",closeModal);}
function confirmExit(){modal(`<h2>Save and exit?</h2><p class="ask">${scr==="round"?"Your current round will be lost, but your stars and levels are kept.":"Your stars and levels will be saved."}</p><div class="row"><button class="btn no" id="y">Yes, save and exit</button><button class="btn go" id="n">No, keep playing</button></div>`);
  on("y",()=>{clearInterval(gameT);hold=false;save();closeModal();showCode();go(()=>{S=null;nameScreen();});});on("n",()=>{closeModal();});}
$("shp").onclick=()=>{sfx("tap");if(!S)return;if(scr==="round"){toast("Finish the round first!");return;}clearInterval(gameT);closeModal();go(shop);};
$("menu").onclick=()=>{sfx("tap");if(!S)return;
  modal(`<h2>Menu</h2><div class="row" style="flex-direction:column"><button class="btn go" id="a1">Resume</button><button class="btn" id="a2">🏠 Home</button><button class="btn" id="a3">💾 Save progress</button><button class="btn" id="a8">⏱️ Round length: ${rlv()}</button><button class="btn" id="a5">🎚️ Difficulty: ${["Easy","Normal","Hard"][dfv()]}</button><button class="btn" id="a7">🗣️ Auto-read: ${S.ra?"On":"Off"}</button><button class="btn" id="a6">🖨️ Practice sheet</button><button class="btn no" id="a4">Exit game</button></div>`);
  on("a1",closeModal);on("a8",()=>{S.rl={5:10,10:15,15:5}[rlv()];save();closeModal();toast("Round length: "+S.rl+" questions");});on("a5",()=>{S.df=(dfv()+1)%3;save();closeModal();toast("Difficulty: "+["Easy","Normal","Hard"][S.df]);});on("a7",()=>{S.ra=!S.ra;save();closeModal();toast("Auto-read "+(S.ra?"on":"off"));});on("a6",()=>{closeModal();sheet();});on("a2",()=>{clearInterval(gameT);closeModal();hold=false;go(home);});on("a3",()=>{closeModal();showCode();});on("a4",()=>{closeModal();confirmExit();});};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
const SWT={sunny:"🟡",ocean:"🔵",space:"🟣",candy:"🩷",jungle:"🟢",sunset:"🟠"};
const TIPS=["Tip: perfect rounds earn bonus stars!","Tip: save your code to come back later.","Tip: unlock new themes in the shop.","Tip: play every day for a streak bonus.","Tip: read the owl’s explanations!"];
let lp=0;const liv=setInterval(()=>{lp=Math.min(100,lp+Math.random()*14+6);$("lbar").style.width=lp+"%";$("ltip").textContent=lp>=100?"Ready!":TIPS[Math.floor(lp/20)%TIPS.length];if(lp>=100){clearInterval(liv);$("lgo").classList.remove("hide");$("lgo").focus();}},220);
$("lgo").onclick=()=>{sfx("good");$("splash").classList.add("gone");setTimeout(()=>$("splash").remove(),450);};
nameScreen();refresh();
</script>
</body>
</html>
